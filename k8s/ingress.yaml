# ──────────────────────────────────────────────
# Ingress — single entry point for all traffic
# ──────────────────────────────────────────────
# Routes:
#   /api/*  →  backend service (port 8080)
#   /*      →  frontend service (port 80)
#
# Prerequisites:
#   This Ingress uses the GCE Ingress Controller
#   (built into GKE by default — no extra install).
# ──────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wanderlust-ingress
  namespace: wanderlust
  labels:
    app: wanderlust
  annotations:
    # Use the default GCE Ingress Controller
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          # Backend API — must come before the catch-all
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Frontend — catch-all for everything else
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
