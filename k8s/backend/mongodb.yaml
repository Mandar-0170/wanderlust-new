# ──────────────────────────────────────────────
# MongoDB — PVC + Deployment + ClusterIP Service
# ──────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: wanderlust
  labels:
    app: wanderlust
    component: mongodb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: wanderlust
  labels:
    app: wanderlust
    component: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wanderlust
      component: mongodb
  strategy:
    type: Recreate           # PVC can only be mounted by one pod
  template:
    metadata:
      labels:
        app: wanderlust
        component: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: wanderlust
  labels:
    app: wanderlust
    component: mongodb
spec:
  type: ClusterIP
  selector:
    app: wanderlust
    component: mongodb
  ports:
    - port: 27017
      targetPort: 27017
