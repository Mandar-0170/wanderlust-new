apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      containers:
      - name: promtail
        image: grafana/promtail:2.9.3
        args:
          - -config.file=/etc/promtail/promtail.yaml

        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi

        volumeMounts:
        - name: config
          mountPath: /etc/promtail

        - name: varlog
          mountPath: /var/log

        - name: containers
          mountPath: /var/log/containers
          readOnly: true

        - name: pods
          mountPath: /var/log/pods
          readOnly: true

      volumes:
      - name: config
        configMap:
          name: promtail-config

      - name: varlog
        hostPath:
          path: /var/log

      - name: containers
        hostPath:
          path: /var/log/containers

      - name: pods
        hostPath:
          path: /var/log/pods
