name: Email Notification Pipeline

on:
  workflow_dispatch

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Print Start Message
        run: echo "Starting pipeline..."

      - name: Simulate Success or Failure
        run: |
          if [ "${{ github.event.inputs.should_fail }}" == "true" ]; then
            echo "Forcing failure..."
            exit 1
          else
            echo "Pipeline succeeded!"
          fi

      # Send email if pipeline succeeds
      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Pipeline SUCCESS"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            The GitHub Actions pipeline completed successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Send email if pipeline fails
      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Pipeline FAILED"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            The GitHub Actions pipeline FAILED.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            Check logs here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}