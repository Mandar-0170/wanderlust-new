name: Test GCP Auth

on:
  push

jobs:
  test-auth:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/85044328168/locations/global/workloadIdentityPools/github-pool-v2/providers/github-provider
          service_account: terraform-ci@project-75e4f40b-a1a0-487f-b1d.iam.gserviceaccount.com

      - name: Test gcloud
        run: gcloud projects list