name: Terraform Dev Deploy

on: workflow_dispatch

jobs:
  
  plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest

    permissions:
      id-token: write     # REQUIRED for Workload Identity Federation
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/917443109321/locations/global/workloadIdentityPools/pool-rd-dev-github/providers/provider-rd-dev-github
          service_account: sa-rd-dev-ghactions@playground-488307.iam.gserviceaccount.com

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # Terraform Plan — save to file for the apply job
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      # Upload the plan file so the apply job can use it
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1

  
  # Job 2: Apply — requires manual approval via
  #         GitHub Environment protection rule
  
  apply:
    name: Terraform Apply (Dev)
    needs: plan
    runs-on: ubuntu-latest
    environment: terraform-dev

    permissions:
      id-token: write     # REQUIRED for Workload Identity Federation
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/917443109321/locations/global/workloadIdentityPools/pool-rd-dev-github/providers/provider-rd-dev-github
          service_account: sa-rd-dev-ghactions@playground-488307.iam.gserviceaccount.com

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      # Download the saved plan from the plan job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      # Apply the exact plan that was reviewed
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false tfplan