name: Terraform Deploy (Dev)

on: workflow_dispatch

env:
  TF_VERSION: "1.6.6"

jobs:

  plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest

    permissions:
      id-token: write     # REQUIRED for Workload Identity Federation
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -backend-config=backend.hcl

      # Terraform Plan — save to file for the apply job
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      # Upload the plan file so the apply job can use it
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1


  # Job 2: Apply — requires manual approval via
  #         GitHub Environment protection rule

  apply:
    name: Terraform Apply (Dev)
    needs: plan
    runs-on: ubuntu-latest
    environment: terraform-dev

    permissions:
      id-token: write     # REQUIRED for Workload Identity Federation
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false -backend-config=backend.hcl

      # Download the saved plan from the plan job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      # Apply the exact plan that was reviewed
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

  notify:
    name: Send Notification
    needs: [plan, apply]
    runs-on: ubuntu-latest
    if: always()

    steps:

      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.plan.result }}" == "failure" ]]; then
            echo "STATUS=FAILED (Plan Stage)" >> $GITHUB_ENV
          elif [[ "${{ needs.apply.result }}" == "failure" ]]; then
            echo "STATUS=FAILED (Apply Stage)" >> $GITHUB_ENV
          elif [[ "${{ needs.apply.result }}" == "skipped" ]]; then
            echo "STATUS=SKIPPED (Awaiting Approval or Not Triggered)" >> $GITHUB_ENV
          else
            echo "STATUS=SUCCESS" >> $GITHUB_ENV
          fi

      # ✅ Send Email (Single Step)
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Workflow - ${{ env.STATUS }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Workflow Status: ${{ env.STATUS }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            Plan Job Status: ${{ needs.plan.result }}
            Apply Job Status: ${{ needs.apply.result }}

            Logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}